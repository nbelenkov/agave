[package]
name = "agave-shred-fuzz"
version = "0.0.0"
publish = false
edition = { workspace = true }

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { workspace = true, features = ["derive"] }
libfuzzer-sys = "0.4"

solana-ledger = { workspace = true, features = [
    "dev-context-only-utils",
    "agave-unstable-api",
] }
agave-shred-wire-format = { workspace = true }
solana-clock = { workspace = true }
solana-hash = { workspace = true }
solana-keypair = { workspace = true }
solana-entry = { workspace = true }
solana-transaction = { workspace = true }
solana-system-transaction = { workspace = true }
solana-runtime = { workspace = true, features = ["dev-context-only-utils"] }
solana-leader-schedule = { workspace = true }
agave-feature-set = { workspace = true }
agave-votor-messages = { workspace = true }
solana-perf = { workspace = true, features = ["dev-context-only-utils"] }
solana-packet = { workspace = true }
tempfile = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
solana-sha256-hasher = { workspace = true }
reed-solomon-erasure = { workspace = true }

[lints.clippy]
arithmetic_side_effects = "allow"

[[bin]]
name = "shred_layout"
path = "fuzz_targets/shred_layout.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shred_parse"
path = "fuzz_targets/shred_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shred_filter_rules"
path = "fuzz_targets/shred_filter_rules.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shred_sigverify"
path = "fuzz_targets/shred_sigverify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shred_filter_packet"
path = "fuzz_targets/shred_filter_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shred_block_roundtrip"
path = "fuzz_targets/shred_block_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shred_ingest_sim"
path = "fuzz_targets/shred_ingest_sim.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shred_recover"
path = "fuzz_targets/shred_recover.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shred_fec_verdict"
path = "fuzz_targets/shred_fec_verdict.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shred_parent_markers"
path = "fuzz_targets/shred_parent_markers.rs"
test = false
doc = false
bench = false

# Seed generator, not a fuzz target.
[[bin]]
name = "gen_seeds"
path = "fuzz_targets/gen_seeds.rs"
test = false
doc = false
bench = false
